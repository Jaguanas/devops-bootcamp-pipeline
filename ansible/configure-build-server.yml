---
- name: Configure Ubuntu CI/CD build server
  hosts: build_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify Ubuntu operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: "This playbook supports Ubuntu only."

  tasks:
    - name: Install Git, Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - git
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Create Concourse configuration directory
      ansible.builtin.file:
        path: /opt/concourse
        state: directory
        owner: root
        group: root
        mode: '0755'
