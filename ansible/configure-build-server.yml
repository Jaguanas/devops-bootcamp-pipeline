---
- name: Configure Ubuntu CI/CD build server
  hosts: build_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify Ubuntu operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
        fail_msg: "This playbook supports Ubuntu only."

  tasks:
    - name: Ensure Git and Docker are installed
      ansible.builtin.apt:
        name:
          - git
          - docker.io
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
