services:
  concourse-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: concourse
      POSTGRES_USER: concourse_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concourse_user -d concourse"]
      interval: 5s
      timeout: 5s
      retries: 10

  concourse:
    image: concourse/concourse:latest
    command: quickstart
    restart: unless-stopped
    privileged: true
    cgroup: host

    depends_on:
      concourse-db:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      # Fixes tested on Ubuntu EC2
      CONCOURSE_WORKER_RUNTIME: guardian
      CONCOURSE_GARDEN_DNS_SERVER: "169.254.169.253"

      # PostgreSQL
      CONCOURSE_POSTGRES_HOST: concourse-db
      CONCOURSE_POSTGRES_USER: concourse_user
      CONCOURSE_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Required}"
      CONCOURSE_POSTGRES_DATABASE: concourse

      # Concourse configuration
      CONCOURSE_EXTERNAL_URL: "http://localhost:8080"
      CONCOURSE_ADD_LOCAL_USER: "admin:${CONCOURSE_ADMIN_PASSWORD:?Required}"
      CONCOURSE_MAIN_TEAM_LOCAL_USER: admin
      CONCOURSE_WORKER_BAGGAGECLAIM_DRIVER: overlay
      CONCOURSE_CLIENT_SECRET: "${CONCOURSE_CLIENT_SECRET:?Required}"
      CONCOURSE_TSA_CLIENT_SECRET: "${CONCOURSE_TSA_CLIENT_SECRET:?Required}"
      CONCOURSE_CLUSTER_NAME: team3
      CONCOURSE_WORKER_CONTAINERD_DNS_SERVER: "169.254.169.253"

volumes:
  postgres_data:
